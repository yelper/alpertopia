<div class="row my-3">
  <div class="col-lg-2 col-3">
    <a href="{{ include.post.url }}">
      <img src="/assets/img/{{ include.post.teaser }}" alt="{{ page.articletitle }}" class="img-fluid img-thumbnail mt-1 mb-3">
    </a>
  </div>
  <div class="col-lg-7 col-md-8 col-9">
    <h4 class="blog-title"><a href="{{ include.post.url }}">{{ include.post.title }}</a></h4>
    <p class="blog-date text-muted">{{ include.post.date | date_to_long_string }}</p>
    <p class="blog-excerpt">{{ include.post.excerpt }}</p>
  </div>
</div>
