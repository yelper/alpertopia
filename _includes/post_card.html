<div class="row my-3">
  <div class="col-lg-3 col-md-4 mb-3">
    <a href="{{ include.post.url }}">
      <img class="img-fluid" src="/assets/img/{{ include.post.teaser }}" alt="Teaser image for this blog include.post.">
    </a>
  </div>
  <div class="col-lg-6 col-md-8">
    <h2><a href="{{ include.post.url }}">{{ include.post.title }}</a></h2>
    <p class="text-muted">{{ include.post.date | date_to_long_string }}</p>
    <p>{{ include.post.excerpt }}</p>
  </div>
</div>
